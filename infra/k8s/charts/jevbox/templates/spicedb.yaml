apiVersion: v1
kind: Service
metadata:
  name: {{ include "jevbox.name" . }}-spicedb
spec:
  selector:
    {{- include "jevbox.spicedbLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8443
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jevbox.name" . }}-spicedb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "jevbox.spicedbLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jevbox.spicedbLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: {{ .Values.spicedb.image | quote }}
          args: [migrate, head]
          env:
            - name: SPICEDB_DATASTORE_ENGINE
              value: postgres
            - name: SPICEDB_DATASTORE_CONN_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SPICEDB_DATABASE_URL
          {{- if .Values.postgres.caSecret }}
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.spicedb.resources | nindent 12 }}
      containers:
        - name: spicedb
          image: {{ .Values.spicedb.image | quote }}
          args: [serve, --telemetry-endpoint=]
          env:
            - name: SPICEDB_DATASTORE_ENGINE
              value: postgres
            - name: SPICEDB_DATASTORE_CONN_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SPICEDB_DATABASE_URL
            - name: SPICEDB_GRPC_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SPICEDB_PRESHARED_KEY
            - name: SPICEDB_HTTP_ENABLED
              value: "true"
            - name: SPICEDB_HTTP_ADDR
              value: ":8443"
          ports:
            - name: http
              containerPort: 8443
            - name: grpc
              containerPort: 50051
          startupProbe:
            grpc:
              port: 50051
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            grpc:
              port: 50051
          livenessProbe:
            tcpSocket:
              port: grpc
          {{- if .Values.postgres.caSecret }}
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.spicedb.resources | nindent 12 }}

      {{- if .Values.postgres.caSecret }}
      volumes:
        - name: postgres-ca
          secret:
            secretName: {{ .Values.postgres.caSecret }}
      {{- end }}
