previews:
  generation: "off"

envVarGroups:
  - name: jevbox-authorization
    envVars:
      - key: SPICEDB_PRESHARED_KEY
        generateValue: true

services:
  - type: pserv
    name: jevbox-spicedb
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - infra/render/spicedb.Dockerfile
        - infra/render/start-spicedb.sh
        - .dockerignore
        - render.yaml
      ignoredPaths: []
    dockerfilePath: ./infra/render/spicedb.Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 45
    envVars:
      - fromGroup: jevbox-authorization
      - key: PORT
        value: "8443"
      - key: SPICEDB_DATASTORE_ENGINE
        value: postgres
      - key: SPICEDB_DATASTORE_CONN_URI
        fromDatabase:
          name: jevbox-authorization-db
          property: connectionString
      - key: SPICEDB_HTTP_ENABLED
        value: "true"
      - key: SPICEDB_DATASTORE_CONN_POOL_READ_MIN_OPEN
        value: "1"
      - key: SPICEDB_DATASTORE_CONN_POOL_READ_MAX_OPEN
        value: "5"
      - key: SPICEDB_DATASTORE_CONN_POOL_WRITE_MIN_OPEN
        value: "1"
      - key: SPICEDB_DATASTORE_CONN_POOL_WRITE_MAX_OPEN
        value: "5"

  - type: web
    name: jevbox-web
    runtime: docker
    region: virginia
    plan: 1c-2g
    numInstances: 1
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - src/**
        - server/**
        - shared/**
        - public/**
        - licenses/**
        - Dockerfile
        - .dockerignore
        - package.json
        - pnpm-lock.yaml
        - tsconfig.json
        - vite.config.ts
        - index.html
        - thumbnail-renderer.html
        - infra/render/start-app.sh
        - render.yaml
      ignoredPaths: []
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh infra/render/start-app.sh web
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 45
    envVars:
      - fromGroup: jevbox-authorization
      - fromGroup: jevbox-app
      - key: APP_ORIGIN
        fromService:
          name: jevbox-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: "4310"
      - key: DATABASE_URL
        fromDatabase:
          name: jevbox-app-db
          property: connectionString
      - key: SPICEDB_HTTP_HOSTPORT
        fromService:
          name: jevbox-spicedb
          type: pserv
          property: hostport
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: ALLOW_SIGNUP
        sync: false

  - type: worker
    name: jevbox-worker
    runtime: docker
    region: virginia
    plan: 1c-2g
    numInstances: 1
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - src/**
        - server/**
        - shared/**
        - public/**
        - licenses/**
        - Dockerfile
        - .dockerignore
        - package.json
        - pnpm-lock.yaml
        - tsconfig.json
        - vite.config.ts
        - index.html
        - thumbnail-renderer.html
        - infra/render/start-app.sh
        - render.yaml
      ignoredPaths: []
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh infra/render/start-app.sh worker
    maxShutdownDelaySeconds: 45
    envVars:
      - fromGroup: jevbox-authorization
      - fromGroup: jevbox-app
      - key: DATABASE_URL
        fromDatabase:
          name: jevbox-app-db
          property: connectionString
      - key: SPICEDB_HTTP_HOSTPORT
        fromService:
          name: jevbox-spicedb
          type: pserv
          property: hostport
      - key: APP_ORIGIN
        fromService:
          name: jevbox-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: jevbox-app-db
    region: virginia
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    databaseName: jevbox
    user: jevbox
    diskSizeGB: 10
    ipAllowList: []
  - name: jevbox-authorization-db
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: spicedb
    user: spicedb
    diskSizeGB: 5
    ipAllowList: []
